<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thử Nghiệm Nội Thất Nhà Của Player (1F & 2F)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #0f172a;
      border-bottom: 2px solid #38bdf8;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #0284c7;
      color: #ffffff;
      font-weight: bold;
    }
    .controls-hint {
      font-size: 13px;
      color: #94a3b8;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }
    .info-bar {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      color: #cbd5e1;
      display: flex;
      gap: 16px;
      pointer-events: none;
    }
    .quick-actions {
      display: flex;
      gap: 10px;
    }
    .quick-btn {
      padding: 6px 12px;
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }
    .quick-btn:hover {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <span>Nhà Của Player (Red's House)</span>
      <span class="badge">1F & 2F Interior System</span>
    </h1>
    <div class="controls-hint">
      Di chuyển: [Mũi tên / W A S D] | Chạy: [Giữ Shift] | Tương tác: [Space / Enter] | Cầu thang: [Bước lên cầu thang]
    </div>
    <div class="quick-actions">
      <button class="quick-btn" id="btnTeleport1F">Tầng 1 (Phòng Khách)</button>
      <button class="quick-btn" id="btnTeleport2F">Tầng 2 (Phòng Ngủ)</button>
      <button class="quick-btn" id="btnTeleportExterior">Ngoài Sân Làng</button>
    </div>
  </header>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="576" height="416"></canvas>
    <div class="info-bar">
      <div>Khu vực: <span id="currentArea" style="color: #38bdf8; font-weight: bold;">Nhà Player Tầng 1</span></div>
      <div>Tọa độ: <span id="playerCoord" style="color: #fde047;">GX: 3, GY: 9</span></div>
      <div>Phòng: <span id="roomStatus" style="color: #4ade80;">1F (Phòng khách & Bếp)</span></div>
    </div>
  </div>

  <script type="module">
    import { InteriorManager } from '/src/interior/interior-manager.ts';
    import { InteriorRegistry } from '/src/interior/interior-registry.ts';
    import { DoorPromptModal } from '/src/interior/door-prompt-modal.ts';
    import { Camera } from '/src/core/camera.ts';
    import { AssetLoader } from '/src/rendering/asset-loader.ts';
    import { Follower } from '/src/entities/follower.ts';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const areaDisplay = document.getElementById('currentArea');
    const coordDisplay = document.getElementById('playerCoord');
    const roomStatus = document.getElementById('roomStatus');

    const loader = new AssetLoader();
    const camera = new Camera(canvas.width, canvas.height);
    const interior = InteriorManager.getInstance();
    const registry = InteriorRegistry.getInstance();
    const doorModal = DoorPromptModal.getInstance();

    const follower = new Follower({
      speciesKey: 'PIKACHU',
      nickname: 'Pikachu',
      isShiny: false,
    });

    const player = {
      x: 0,
      y: 64,
      gx: 0,
      gy: 2,
      direction: 3,
    };

    let inOverworld = false;

    // Enter Player House 1F
    function enter1F() {
      const config1F = registry.getRoom('player_house_1f');
      if (!config1F) return;
      inOverworld = false;
      doorModal.close();
      doorModal.hideIndicator();
      interior.enterRoom(config1F, { gx: config1F.spawnGX, gy: config1F.spawnGY, direction: config1F.spawnDirection }, follower);
      areaDisplay.textContent = 'Nhà Player - Tầng 1';
      roomStatus.textContent = '1F (Phòng khách & Bếp)';
    }

    // Enter Player House 2F
    function enter2F() {
      const config2F = registry.getRoom('player_house_2f');
      if (!config2F) return;
      inOverworld = false;
      doorModal.close();
      doorModal.hideIndicator();
      interior.enterRoom(config2F, { gx: config2F.spawnGX, gy: config2F.spawnGY, direction: config2F.spawnDirection }, follower);
      areaDisplay.textContent = 'Nhà Player - Tầng 2';
      roomStatus.textContent = '2F (Phòng ngủ & PC)';
    }

    // Callback when stepping onto door mat to exit house
    interior.onExitRoomCallback = (coords) => {
      inOverworld = true;
      player.gx = coords.gx;
      player.gy = coords.gy;
      player.x = player.gx * 32;
      player.y = player.gy * 32;
      player.direction = 0; // Face south away from house
      areaDisplay.textContent = 'Trước Cửa Nhà Player (Overworld)';
      roomStatus.textContent = 'Ngoài sân';
    };

    // Keyboard handlers
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'space'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }

      if (e.key === ' ' || e.key === 'Enter' || e.key.toLowerCase() === 'e' || e.key.toLowerCase() === 'z') {
        if (!inOverworld) {
          if (interior.activeDialogue) {
            interior.advanceDialogue();
          } else {
            interior.handleInteract(follower);
          }
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Quick Teleport Buttons
    document.getElementById('btnTeleport1F').onclick = () => {
      enter1F();
    };

    document.getElementById('btnTeleport2F').onclick = () => {
      enter2F();
    };

    document.getElementById('btnTeleportExterior').onclick = () => {
      if (!inOverworld) interior.exitCurrentRoom();
    };

    // Load assets
    await loader.loadFromManifest('/assets/manifest.json');

    // Default start inside 1F
    enter1F();

    let yardStepProgress = 0;
    let yardStepCount = 0;

    // Main animation loop
    function loop() {
      requestAnimationFrame(loop);

      const isRunning = keys['shift'];
      let dx = 0;
      let dy = 0;
      if (keys['arrowdown'] || keys['s']) dy = 1;
      else if (keys['arrowleft'] || keys['a']) dx = -1;
      else if (keys['arrowright'] || keys['d']) dx = 1;
      else if (keys['arrowup'] || keys['w']) dy = -1;

      if (!inOverworld) {
        interior.update({ dx, dy, isMoving: dx !== 0 || dy !== 0 }, 1.0, isRunning, follower);
        coordDisplay.textContent = `GX: ${interior.roomPlayerGX}, GY: ${interior.roomPlayerGY}`;
        if (interior.currentRoom) {
          roomStatus.textContent = interior.currentRoom.id === 'player_house_1f' ? '1F (Phòng khách & Bếp)' : '2F (Phòng ngủ & PC)';
          areaDisplay.textContent = interior.currentRoom.name;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        camera.x = 0;
        camera.y = 0;
        camera.applyTransform(ctx, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;

        interior.render(ctx, camera, player, follower, loader, canvas.width, canvas.height);
        ctx.restore();
      } else {
        // Overworld Yard simulation
        let yardWalkFrame = 0;
        if (dx !== 0 || dy !== 0) {
          player.direction = dy > 0 ? 0 : (dx < 0 ? 1 : (dx > 0 ? 2 : 3));
          const stepSpeed = isRunning ? (3.6 / 32) : (2.0 / 32);
          yardStepProgress += stepSpeed;
          if (yardStepProgress >= 1.0) {
            yardStepProgress -= 1.0;
            yardStepCount++;
          }

          if (yardStepCount % 2 === 1) {
            yardWalkFrame = yardStepProgress < 0.2 ? 0 : (yardStepProgress < 0.8 ? 1 : 2);
          } else {
            yardWalkFrame = yardStepProgress < 0.2 ? 2 : (yardStepProgress < 0.8 ? 3 : 0);
          }

          const nextGX = Math.max(-5, Math.min(5, player.gx + dx * stepSpeed));
          const nextGY = Math.max(1, Math.min(6, player.gy + dy * stepSpeed));

          // Solid house base
          const hitsBuilding = nextGY <= 1.25 && Math.abs(nextGX) <= 2.5;
          if (!hitsBuilding) {
            player.gx = nextGX;
            player.gy = nextGY;
            player.x = player.gx * 32;
            player.y = player.gy * 32;
          }
        } else {
          yardStepProgress = 0;
          yardWalkFrame = 0;
        }

        camera.snapTo(player);
        coordDisplay.textContent = `X: ${player.gx.toFixed(1)}, Y: ${player.gy.toFixed(1)}`;
        roomStatus.textContent = 'Sân trước nhà';

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        camera.applyTransform(ctx, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;

        // Draw ground tiles
        const floorImg = loader.getImage('house_floor');
        for (let y = -2; y <= 8; y++) {
          for (let x = -8; x <= 8; x++) {
            if (floorImg) ctx.drawImage(floorImg, x * 32, y * 32, 32, 32);
          }
        }

        // Draw Player House exterior
        const houseImg = loader.getImage('house_red') || loader.getImage('building_house_red') || loader.getImage('building_okido');
        if (houseImg) {
          ctx.drawImage(houseImg, -80, -96, 160, 128);
        }

        // Draw Player
        const pImg = loader.getImage('char_red_sheet');
        if (pImg) {
          ctx.drawImage(pImg, yardWalkFrame * 64, player.direction * 64, 64, 64, player.x - 16, player.y - 32, 64, 64);
        }

        ctx.restore();

        // Check door proximity
        const atDoor = Math.abs(player.gx) <= 1.0 && player.gy <= 2.2 && player.direction === 3;
        if (atDoor && !doorModal.isPromptOpen()) {
          doorModal.showIndicator('Nhà của Red', {
            buildingName: 'Nhà của Bạn (Player House)',
            onEnter: enter1F,
          });
        } else {
          doorModal.hideIndicator();
        }
      }
    }

    loop();
  </script>
</body>
</html>
