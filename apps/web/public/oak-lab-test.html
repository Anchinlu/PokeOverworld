<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thử Nghiệm Nội Thất Viện Nghiên Cứu Giáo Sư Oak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #0f172a;
      border-bottom: 2px solid #38bdf8;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #0284c7;
      color: #ffffff;
      font-weight: bold;
    }
    .controls-hint {
      font-size: 13px;
      color: #94a3b8;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }
    .info-bar {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      color: #cbd5e1;
      display: flex;
      gap: 16px;
      pointer-events: none;
    }
    .quick-actions {
      display: flex;
      gap: 10px;
    }
    .quick-btn {
      padding: 6px 12px;
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }
    .quick-btn:hover {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <span>Viện Nghiên Cứu Giáo Sư Oak</span>
      <span class="badge">Nội Thất 17 Assets</span>
      <span class="badge" style="background:#10b981;">0 Poké Ball (Theo Yêu Cầu)</span>
      <span class="badge" style="background:#eab308;color:#000;">Pikachu Đồng Hành Trong Nhà</span>
      <span class="badge" style="background:#8b5cf6;">NPC Hoạt Họa & Hành Vi</span>
    </h1>
    <div class="controls-hint">
      Di chuyển: <b>Mũi tên / W-A-S-D</b> | Tương tác & Nói chuyện: <b>Space / Enter</b> | Chạy: <b>Giữ Shift</b>
    </div>
    <div class="quick-actions">
      <button class="quick-btn" id="btnTeleportLab">Vào Thẳng Phòng Lab</button>
      <button class="quick-btn" id="btnTeleportExterior">Ra Sân Làng Khởi Đầu</button>
    </div>
  </header>

  <div class="canvas-container">
    <canvas id="testCanvas" width="640" height="480"></canvas>
    <div class="info-bar" id="infoBar">
      <span>Trạng thái: <b id="sceneState" style="color:#38bdf8">Ngoại cảnh Làng</b></span>
      <span>Tọa độ: <b id="coordDisplay">X: 0, Y: 0</b></span>
      <span>NPC gần nhất: <b id="npcDisplay">Không</b></span>
    </div>
  </div>

  <script type="module">
    import { AssetLoader } from '/src/rendering/asset-loader.ts';
    import { Camera } from '/src/core/camera.ts';
    import { Player } from '/src/entities/player.ts';
    import { Follower } from '/src/entities/follower.ts';
    import { InteriorManager } from '/src/interior/interior-manager.ts';
    import { DoorPromptModal, playDoorTransition } from '/src/interior/door-prompt-modal.ts';
    import { OAK_LAB_INTERIOR_CONFIG } from '/src/interior/oak-lab-interior.ts';

    const canvas = document.getElementById('testCanvas');
    const ctx = canvas.getContext('2d');
    const sceneStateEl = document.getElementById('sceneState');
    const coordDisplay = document.getElementById('coordDisplay');
    const npcDisplay = document.getElementById('npcDisplay');

    const loader = AssetLoader.getDefault();
    const camera = new Camera(0, 0);
    const player = new Player(0, 0, 3);
    const follower = new Follower(0, 1, 3);
    const interior = InteriorManager.getInstance();
    const doorModal = DoorPromptModal.getInstance();

    let inOverworld = true;
    let keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;

      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE') {
        if (!inOverworld) {
          interior.handleInteract(follower);
        } else {
          // Check if facing lab door
          if (Math.abs(player.gx) <= 1 && player.gy === 1 && player.direction === 3) {
            doorModal.open({
              buildingName: 'Viện Nghiên Cứu Giáo Sư Oak',
              onEnter: enterLab,
            });
          }
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    function enterLab() {
      doorModal.hideIndicator();
      playDoorTransition(() => {
        inOverworld = false;
        doorModal.hideIndicator();
        interior.enterOakLab({ gx: 0, gy: 1, direction: 3 }, follower);
        sceneStateEl.textContent = 'Phòng Nghiên Cứu Oak';
        sceneStateEl.style.color = '#facc15';
      });
    }

    function exitLab() {
      playDoorTransition(() => {
        inOverworld = true;
        player.gx = 0;
        player.gy = 1.8; // Safely in front of the lab door outside
        player.direction = 0; // Facing south toward courtyard
        player.x = 0;
        player.y = 1.8 * 32;
        follower.snapTo(0, 0.8, 0);
        sceneStateEl.textContent = 'Ngoại cảnh Làng';
        sceneStateEl.style.color = '#38bdf8';
      });
    }

    interior.onExitRoomCallback = () => {
      exitLab();
    };

    document.getElementById('btnTeleportLab').onclick = () => {
      if (inOverworld) enterLab();
    };

    document.getElementById('btnTeleportExterior').onclick = () => {
      if (!inOverworld) interior.exitCurrentRoom();
    };

    // Load assets
    await loader.loadFromManifest('/assets/manifest.json');

    let yardStepProgress = 0;
    let yardStepCount = 0;

    // Main animation loop
    function loop() {
      requestAnimationFrame(loop);

      const isRunning = keys['shift'];
      let dx = 0;
      let dy = 0;
      if (keys['arrowdown'] || keys['s']) dy = 1;
      else if (keys['arrowleft'] || keys['a']) dx = -1;
      else if (keys['arrowright'] || keys['d']) dx = 1;
      else if (keys['arrowup'] || keys['w']) dy = -1;

      if (!inOverworld) {
        interior.update({ dx, dy, isMoving: dx !== 0 || dy !== 0 }, 1.0, isRunning, follower);
        let nearestNpc = 'Không';
        if (interior.roomPlayerGX <= 4 && interior.roomPlayerGY <= 6) nearestNpc = 'Kỹ Sư Nghiên Cứu';
        else if (interior.roomPlayerGX >= 10 && interior.roomPlayerGY <= 6) nearestNpc = 'Trợ Lý Nghiên Cứu';
        else if (interior.roomPlayerGY <= 5) nearestNpc = 'Giáo Sư Oak';
        npcDisplay.textContent = nearestNpc;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        camera.applyTransform(ctx, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;

        interior.render(ctx, camera, player, follower, loader, canvas.width, canvas.height);
        ctx.restore();
      } else {
        // Simple overworld yard simulation matching authentic game speed and animation
        let yardWalkFrame = 0;
        if (dx !== 0 || dy !== 0) {
          player.direction = dy > 0 ? 0 : (dx < 0 ? 1 : (dx > 0 ? 2 : 3));
          const stepSpeed = isRunning ? (3.6 / 32) : (2.0 / 32);
          yardStepProgress += stepSpeed;
          if (yardStepProgress >= 1.0) {
            yardStepProgress -= 1.0;
            yardStepCount++;
          }

          // Authentic GBA Pokémon step cycle
          if (yardStepCount % 2 === 1) {
            yardWalkFrame = yardStepProgress < 0.2 ? 0 : (yardStepProgress < 0.8 ? 1 : 2);
          } else {
            yardWalkFrame = yardStepProgress < 0.2 ? 2 : (yardStepProgress < 0.8 ? 3 : 0);
          }

          const nextGX = Math.max(-5, Math.min(5, player.gx + dx * stepSpeed));
          const nextGY = Math.max(1, Math.min(6, player.gy + dy * stepSpeed));

          // Solid building hitbox: entire base (including door) is solid to prevent walking into the building
          // Building base is at Y <= 1.25, width between -3.5 and +3.5
          const hitsBuilding = nextGY <= 1.25 && Math.abs(nextGX) <= 3.5;
          if (!hitsBuilding) {
            player.gx = nextGX;
            player.gy = nextGY;
            player.x = player.gx * 32;
            player.y = player.gy * 32;
          }
        } else {
          yardStepProgress = 0;
          yardWalkFrame = 0;
        }

        camera.snapTo(player);
        coordDisplay.textContent = `X: ${player.gx.toFixed(1)}, Y: ${player.gy.toFixed(1)}`;
        npcDisplay.textContent = 'Trước cửa Viện Nghiên Cứu';

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        camera.applyTransform(ctx, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;

        // Draw ground tiles
        const floorImg = loader.getImage('lab_floor_inner');
        for (let y = -2; y <= 8; y++) {
          for (let x = -8; x <= 8; x++) {
            if (floorImg) ctx.drawImage(floorImg, x * 32, y * 32, 32, 32);
          }
        }

        // Draw Okido lab exterior
        const labImg = loader.getImage('building_okido') || loader.getImage('nhà tiến sĩ okido');
        if (labImg) {
          ctx.drawImage(labImg, -112, -96, 224, 128);
        }

        // Draw Player with matching walk frame
        const pImg = loader.getImage('char_red_sheet');
        if (pImg) {
          ctx.drawImage(pImg, yardWalkFrame * 64, player.direction * 64, 64, 64, player.x - 16, player.y - 32, 64, 64);
        }

        ctx.restore();

        // Check door proximity: right in front of the door (gy between 1.25 and 2.2, facing North)
        const atDoor = Math.abs(player.gx) <= 1.2 && player.gy <= 2.2 && player.direction === 3;
        if (atDoor && !doorModal.isPromptOpen()) {
          doorModal.showIndicator('Viện Nghiên Cứu Oak', {
            buildingName: 'Viện Nghiên Cứu Giáo Sư Oak',
            onEnter: enterLab,
          });
        } else {
          doorModal.hideIndicator();
        }
      }
    }

    loop();
  </script>
</body>
</html>
