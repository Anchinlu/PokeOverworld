        TILE_ASSETS['tall_grass'] = 'Graphics/Tilesets/Plant_Parts/tall_grass_strip.png';
      }
      // Bổ sung toàn bộ ảnh cây Berry từ Graphics/Tilesets/Bery/
      BERRY_ROSTER.forEach(b => {
        TILE_ASSETS[`berry_${b.id}`] = `Graphics/Tilesets/Bery/berrytree_${b.id}.png`;
      });

      const assetKeys = Object.keys(TILE_ASSETS);
      let count = 0;
      assetKeys.forEach(k => {
        const img = new Image();
        img.onload = () => {
          count++;
          if (count === assetKeys.length) callback();
        };
        img.onerror = () => {
          console.warn(`Không thể nạp asset: ${TILE_ASSETS[k]}`);
          count++;
          if (count === assetKeys.length) callback();
        };
        img.src = TILE_ASSETS[k];
        loadedImages[k] = img;
      });
    }

    function resetWorld() {
      eastHillCache.clear();
      westMaxXCache.clear();
      hillTileCache.clear();
      const seed = parseInt(inputSeed ? inputSeed.value : 101) || 101;
      chunkManager.reset(seed);

      // Đặt Red ngay giữa con đường chính ở chunk [0, 0] theo chuẩn tọa độ ô (Grid tile)
      const roadCenter = getRoadCenterX(0, seed);
      player.gx = roadCenter;
      player.gy = 0;
      player.x = player.gx * TILE_SIZE - 16;
      player.y = player.gy * TILE_SIZE - 32;
      player.dir = 0; // Nhìn Xuống (South)
      player.isMoving = false;
      player.frame = 0;
      player.stepProgress = 0;
      player.blocked = false;

      // Pikachu đứng ngay ô phía sau Red (ô Bắc: gy = -1)
      pika.gx = player.gx;
      pika.gy = player.gy - 1;
      pika.x = pika.gx * TILE_SIZE - 16;
      pika.y = pika.gy * TILE_SIZE - 32;
      pika.dir = 0; // Nhìn Xuống (South)
      pika.isMoving = false;
      pika.frame = 0;
      pika.stepProgress = 0;
      pika.isDodge = false;

      camera.snap(player);
      chunkManager.update(player.x, player.y);
    }

    function canMoveToTile(gx, gy) {
      if (!chkCollision || !chkCollision.checked) return true;

      // Vách đá cao nguyên là chướng ngại vật tự nhiên
      const seed = parseInt(inputSeed ? inputSeed.value : 101) || 101;
      if (isHillTile(gx, gy, seed)) {
        return false;
      }

      const testX = gx * TILE_SIZE - 16;
      const testY = gy * TILE_SIZE - 32;
      const pBox = {
        x: testX + 22,
        y: testY + 48,
        w: 20,
        h: 14
      };

      // Tối ưu hóa: Chỉ kiểm tra collider của chunk đích (và chunk liền kề nếu sát biên)
      const targetCX = Math.floor(gx / CHUNK_SIZE);
      const targetCY = Math.floor(gy / CHUNK_SIZE);
      const cList = [chunkManager.getChunk(targetCX, targetCY)];

      const lx = ((gx % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
      const ly = ((gy % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
      if (lx === 0) cList.push(chunkManager.getChunk(targetCX - 1, targetCY));
      else if (lx === CHUNK_SIZE - 1) cList.push(chunkManager.getChunk(targetCX + 1, targetCY));
      if (ly === 0) cList.push(chunkManager.getChunk(targetCX, targetCY - 1));
      else if (ly === CHUNK_SIZE - 1) cList.push(chunkManager.getChunk(targetCX, targetCY + 1));

      for (const chunk of cList) {
        if (!chunk) continue;
        for (const c of chunk.colliders) {
          if (pBox.x < c.x + c.w &&
              pBox.x + pBox.w > c.x &&
              pBox.y < c.y + c.h &&
              pBox.y + pBox.h > c.y) {
            return false;
          }
        }
      }
      return true;
    }

    // --- INPUT LISTENERS (4 hướng chính, cấm tuyệt đối đi chéo) ---
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(k)) {
        if (!keyQueue.includes(k)) keyQueue.push(k);
        keys[k] = true;
        e.preventDefault();
      }
      if (k === 'shift') {
        keys['shift'] = true;
      }
      if ([' ', 'enter', 'e'].includes(k)) {
        triggerBerryInteraction();
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      const idx = keyQueue.indexOf(k);
      if (idx !== -1) keyQueue.splice(idx, 1);
      keys[k] = false;
      if (k === 'shift') {
        keys['shift'] = false;
      }
    });

    // Hàm lấy hướng điều khiển duy nhất (Cardinal Direction) - loại bỏ hoàn toàn đi chéo
    function getRequestedDir() {
      for (let i = keyQueue.length - 1; i >= 0; i--) {
        const k = keyQueue[i];
        if (k === 'arrowup' || k === 'w') return 3;    // Lên (North)
        if (k === 'arrowdown' || k === 's') return 0;  // Xuống (South)
        if (k === 'arrowleft' || k === 'a') return 1;  // Trái (West)
        if (k === 'arrowright' || k === 'd') return 2; // Phải (East)
      }
      return null;
    }

    // Cố định camera 1x, vô hiệu hóa hoàn toàn thu phóng chuột và phím tắt trình duyệt
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
        e.preventDefault();
      }
    });

    // Hàm tính hoạt ảnh bước chân luân phiên chuẩn Pokémon:
    // Mỗi ô là 1 bước chân hoàn chỉnh luân phiên nhịp nhàng:
    // Step lẻ (Chân trái): 0 (Đứng) -> 1 (Chân trái vươn bước) -> 2 (Đứng chạm đất)
    // Step chẵn (Chân phải): 2 (Đứng) -> 3 (Chân phải vươn bước) -> 0 (Đứng chạm đất)
    function getStepFrame(stepCount, progress) {
      if (stepCount % 2 === 1) {
        if (progress < 0.2) return 0;
        if (progress < 0.8) return 1;
        return 2;
      } else {
        if (progress < 0.2) return 2;
        if (progress < 0.8) return 3;
        return 0;
      }
    }

    // --- UPDATE LOOP (Grid-based Movement Engine) ---
    function update(dtScale = 1.0) {
      // 1. Nếu Red đang dừng trên ô, nhận lệnh để bắt đầu bước đi sang ô tiếp theo
      if (!player.isMoving) {
        const reqDir = getRequestedDir();
        if (reqDir !== null) {
          player.dir = reqDir;

          let nextGX = player.gx;
          let nextGY = player.gy;
          if (reqDir === 0) nextGY += 1;      // Xuống
          else if (reqDir === 1) nextGX -= 1; // Trái
          else if (reqDir === 2) nextGX += 1; // Phải
          else if (reqDir === 3) nextGY -= 1; // Lên

          if (canMoveToTile(nextGX, nextGY)) {
            player.stepCount = (player.stepCount || 0) + 1;
            player.isMoving = true;
            player.blocked = false;
            player.fromX = player.gx * TILE_SIZE - 16;
            player.fromY = player.gy * TILE_SIZE - 32;
            player.targetGX = nextGX;
            player.targetGY = nextGY;
            player.targetX = nextGX * TILE_SIZE - 16;
            player.targetY = nextGY * TILE_SIZE - 32;
            player.stepProgress = 0;

            // Kích hoạt Pikachu bước vào ô Red vừa rời đi
            if (pika.gx !== player.gx || pika.gy !== player.gy) {
              pika.stepCount = player.stepCount;
              pika.isMoving = true;
              pika.fromX = pika.gx * TILE_SIZE - 16;
              pika.fromY = pika.gy * TILE_SIZE - 32;
              pika.fromGX = pika.gx;
              pika.fromGY = pika.gy;
              pika.targetGX = player.gx;
              pika.targetGY = player.gy;
              pika.targetX = player.gx * TILE_SIZE - 16;
              pika.targetY = player.gy * TILE_SIZE - 32;
              pika.stepProgress = 0;

              // Kiểm tra xem Red có quay đầu 180 độ bước vào ô Pikachu đang đứng không
              pika.isDodge = (nextGX === pika.gx && nextGY === pika.gy);

              // Định hướng Pikachu theo hướng bước sang ô của Red
              const pdx = pika.targetGX - pika.gx;
              const pdy = pika.targetGY - pika.gy;
              if (pdx > 0) pika.dir = 2;      // Phải
              else if (pdx < 0) pika.dir = 1; // Trái
              else if (pdy > 0) pika.dir = 0; // Xuống
              else if (pdy < 0) pika.dir = 3; // Lên
            }
          } else {
            // Gặp chướng ngại vật (gốc cây): quay mặt nhìn vào vật thể, dừng bước
            player.blocked = true;
            player.frame = 0;
            pika.frame = 0;
          }
        } else {
          // Không có phím di chuyển: dừng lại chuẩn ô
          player.blocked = false;
          player.frame = 0;
          pika.frame = 0;
          pika.dir = player.dir;
        }
      }

      // 2. Nội suy vị trí hiển thị khi đang bước từ ô này sang ô khác
      if (player.isMoving) {
        // Tốc độ di chuyển theo ô chuẩn Pokémon:
        const speedSetting = document.getElementById('selectWalkSpeed')?.value || 'classic';
        let baseStepPx = 2.0; // 16 frame / ô (Chuẩn Pokémon GBA, thong thả tự nhiên)
        if (speedSetting === 'brisk') baseStepPx = 2.67; // 12 frame / ô
        else if (speedSetting === 'run') baseStepPx = 4.0; // 8 frame / ô

        // Giữ phím Shift kích hoạt Giày chạy (Running Shoes)
        const isRunning = !!keys['shift'];
        const stepPx = isRunning ? Math.min(baseStepPx * 1.8, 5.33) : baseStepPx;
        player.stepProgress += (stepPx / TILE_SIZE) * dtScale;

        if (player.stepProgress >= 1.0) {
          // Hoàn thành trọn vẹn 1 ô
          player.stepProgress = 1.0;
          player.gx = player.targetGX;
          player.gy = player.targetGY;
          player.x = player.targetX;
          player.y = player.targetY;
          player.isMoving = false;
          player.frame = 0;

          if (pika.isMoving) {
            pika.stepProgress = 1.0;
            pika.gx = pika.targetGX;
            pika.gy = pika.targetGY;
            pika.x = pika.targetX;
            pika.y = pika.targetY;
            pika.isMoving = false;
            pika.frame = 0;
            pika.isDodge = false;
          }
        } else {
          // Di chuyển mượt mà giữa 2 ô
          player.x = player.fromX + (player.targetX - player.fromX) * player.stepProgress;
          player.y = player.fromY + (player.targetY - player.fromY) * player.stepProgress;
          player.frame = getStepFrame(player.stepCount, player.stepProgress);

          if (pika.isMoving) {
            pika.stepProgress = player.stepProgress;
            let px = pika.fromX + (pika.targetX - pika.fromX) * pika.stepProgress;
            let py = pika.fromY + (pika.targetY - pika.fromY) * pika.stepProgress;

            // Nếu né khi Red quay đầu 180 độ, tạo đường vòng cung nhẹ sang bên tránh xuyên thấu
            if (pika.isDodge) {
              const arc = Math.sin(pika.stepProgress * Math.PI) * 10;
              if (pika.targetGY !== pika.fromGY) px += arc;
              else py -= arc;
            }

            pika.x = px;
            pika.y = py;
            pika.frame = getStepFrame(pika.stepCount, pika.stepProgress);
          }
        }
      }

      // 3. Camera bám mượt mà theo Red
      camera.update(player);

      // 4. Cập nhật các chunk xung quanh nhân vật
      const { pChunkX, pChunkY } = chunkManager.update(player.x, player.y);

      // 5. Cập nhật thông số HUD (Chỉ cập nhật định kỳ mỗi 6 frame để loại bỏ layout thrashing)
      hudTick = (hudTick || 0) + 1;
      if (hudTick % 6 === 0) {
        if (lblPlayerPos) lblPlayerPos.innerText = `[${player.gx}, ${player.gy}] (${Math.round(player.x)}, ${Math.round(player.y)}px)`;
        if (lblChunkPos) lblChunkPos.innerText = `[${pChunkX}, ${pChunkY}]`;
        if (lblActiveChunks) lblActiveChunks.innerText = `${chunkManager.activeChunks.length} chunks`;

        if (lblCollisionStatus) {
          if (player.blocked) {
            lblCollisionStatus.innerText = 'Bị cản trở (Gốc cây)';
            lblCollisionStatus.className = 'badge danger';
          } else {
            lblCollisionStatus.innerText = player.isMoving ? 'Đang bước (Theo ô)' : 'Đứng yên (Chuẩn ô)';
            lblCollisionStatus.className = 'badge success';
          }
        }
      }

      // 6. Cập nhật AI Pokémon hoang dã
      updateWildPokemon(chunkManager, dtScale);
    }

    // --- RENDER LOOP ---
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      const viewW = canvas.width / camera.zoom;
      const viewH = canvas.height / camera.zoom;

      // Transform camera theo Red
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-Math.round(camera.x - viewW / 2), -Math.round(camera.y - viewH / 2));

      // Frustum culling bounds
      const minX = camera.x - viewW / 2 - 64;
      const maxX = camera.x + viewW / 2 + 64;
      const minY = camera.y - viewH / 2 - 128;
      const maxY = camera.y + viewH / 2 + 64;

      // 1. Vẽ mặt đất của các active chunks nhìn thấy
      for (const chunk of chunkManager.activeChunks) {
        const cPxX = chunk.cx * CHUNK_PIXELS;
        const cPxY = chunk.cy * CHUNK_PIXELS;
        if (cPxX + CHUNK_PIXELS >= minX && cPxX <= maxX &&
            cPxY + CHUNK_PIXELS >= minY && cPxY <= maxY) {
          ctx.drawImage(chunk.groundCanvas, cPxX, cPxY);
        }
      }

      // 2. Chế độ Heatmap phân vùng ID (nếu bật)
      if (chkHeatmap && chkHeatmap.checked) {
        for (const chunk of chunkManager.activeChunks) {
          const cPxX = chunk.cx * CHUNK_PIXELS;
          const cPxY = chunk.cy * CHUNK_PIXELS;
          for (let ly = 0; ly < CHUNK_SIZE; ly++) {
            for (let lx = 0; lx < CHUNK_SIZE; lx++) {
              const tid = chunk.terrainGrid[ly][lx];
              if (tid === TERRAIN.GRASS) ctx.fillStyle = 'rgba(34, 197, 94, 0.55)';
              else if (tid === TERRAIN.ROAD) ctx.fillStyle = 'rgba(234, 179, 8, 0.65)';
              else if (tid === TERRAIN.BEACH_SAND) ctx.fillStyle = 'rgba(249, 115, 22, 0.65)';
              else if (tid === TERRAIN.HILL) ctx.fillStyle = 'rgba(168, 85, 247, 0.65)';
              ctx.fillRect(cPxX + lx * 32, cPxY + ly * 32, 32, 32);
            }
          }
        }
      }

      // 2.4. Bãi cỏ cao hoang dã GBA (Animated Wild Tall Grass Patches)
      const showTallGrass = !chkTallGrass || chkTallGrass.checked;
      const imgTG = loadedImages['tall_grass'];
      if (showTallGrass && imgTG) {
        const animTime = performance.now();
        for (const chunk of chunkManager.activeChunks) {
          if (!chunk.tallGrass) continue;
          const cPxX = chunk.cx * CHUNK_PIXELS;
          const cPxY = chunk.cy * CHUNK_PIXELS;
          if (cPxX + CHUNK_PIXELS < minX || cPxX > maxX ||
              cPxY + CHUNK_PIXELS < minY || cPxY > maxY) {
            continue;
          }

          for (const tg of chunk.tallGrass) {
            if (tg.x + 32 >= minX && tg.x <= maxX && tg.y + 32 >= minY && tg.y <= maxY) {
              const isSteppedOn = (player.gx === tg.gx && player.gy === tg.gy) ||
                                  (player.isMoving && player.targetGX === tg.gx && player.targetGY === tg.gy) ||
                                  (pika.gx === tg.gx && pika.gy === tg.gy) ||
                                  (pika.isMoving && pika.targetGX === tg.gx && pika.targetGY === tg.gy);
              let fIdx = 0;
              if (isSteppedOn) {
                // Rung đung đưa theo nhịp bước chân khi nhân vật bước vào cỏ
                fIdx = Math.floor((animTime / 120) % 4) + 1;
              } else {
                // Gió thoảng đợt sóng nhịp nhàng chuẩn GBA: đa phần tĩnh (frame 0), thỉnh thoảng gợn sóng (frames 1..4)
                const wave = Math.sin(animTime * 0.0016 + tg.phase);
                if (wave > 0.45) {
                  fIdx = Math.min(4, Math.floor(((wave - 0.45) / 0.55) * 4) + 1);
                } else {
                  fIdx = 0;
                }
              }

              ctx.drawImage(
                imgTG,
                fIdx * 32, 0, 32, 32,
                tg.x, tg.y, 32, 32
              );
            }
          }
        }
      }

      // 2.5. Hoạt ảnh thực vật & hoa dại đung đưa theo gió (Animated Wildflowers & Foliage)
      const showPlants = !chkPlants || chkPlants.checked;
      if (showPlants) {
        const animTime = performance.now();
        const frameDuration = 180; // Chu kỳ đung đưa ~180ms mỗi frame

        for (const chunk of chunkManager.activeChunks) {
          const cPxX = chunk.cx * CHUNK_PIXELS;
          const cPxY = chunk.cy * CHUNK_PIXELS;
          if (cPxX + CHUNK_PIXELS < minX || cPxX > maxX ||
              cPxY + CHUNK_PIXELS < minY || cPxY > maxY) {
            continue;
          }

          for (const p of chunk.plants) {
            if (p.x + 32 >= minX && p.x <= maxX && p.y + 32 >= minY && p.y <= maxY) {
              const img = loadedImages[p.type];
              if (img) {
                // Tính frame chuyển động riêng cho từng bông hoa/bụi cỏ (0 -> 4)
                const fIdx = Math.floor((animTime / frameDuration + p.phase) % 5);
                ctx.drawImage(
                  img,
                  fIdx * 32, 0, 32, 32,
                  p.x, p.y, 32, 32
                );
              }
            }
          }
        }
      }

      // 3. Hiển thị lưới Chunk 16x16 (Ranh giới chunk & Badge tọa độ)
      if (chkChunkGrid && chkChunkGrid.checked) {
        ctx.save();
        for (const chunk of chunkManager.activeChunks) {
          const cPxX = chunk.cx * CHUNK_PIXELS;
          const cPxY = chunk.cy * CHUNK_PIXELS;

          // Đường viền chunk màu cyan phát sáng
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
          ctx.lineWidth = 2;
          ctx.strokeRect(cPxX + 1, cPxY + 1, CHUNK_PIXELS - 2, CHUNK_PIXELS - 2);

          // Nhãn Badge Chunk [cx, cy]
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.fillRect(cPxX + 8, cPxY + 8, 92, 22);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
          ctx.lineWidth = 1;
          ctx.strokeRect(cPxX + 8, cPxY + 8, 92, 22);

          ctx.fillStyle = '#38bdf8';
          ctx.font = '600 11px "JetBrains Mono", monospace';
          ctx.fillText(`Chunk [${chunk.cx},${chunk.cy}]`, cPxX + 14, cPxY + 23);
        }
        ctx.restore();
      }

      // 4. Lưới tile 32x32 px
      if (chkGrid && chkGrid.checked) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        const startX = Math.floor(minX / 32) * 32;
        const endX   = Math.ceil(maxX / 32) * 32;
        const startY = Math.floor(minY / 32) * 32;
        const endY   = Math.ceil(maxY / 32) * 32;

        for (let x = startX; x <= endX; x += 32) {
          ctx.beginPath();
          ctx.moveTo(x + 0.5, startY);
          ctx.lineTo(x + 0.5, endY);
          ctx.stroke();
        }
        for (let y = startY; y <= endY; y += 32) {
          ctx.beginPath();
          ctx.moveTo(startX, y + 0.5);
          ctx.lineTo(endX, y + 0.5);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 5. Bóng đổ nhân vật Red & Pikachu
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(player.x + 32, player.y + 58, 12, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(pika.x + 32, pika.y + 56, 10, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 6. Gom toàn bộ thực thể để sắp xếp Y-Sorting 2.5D
      const renderList = [];

      // Gom cây cối từ các chunk đang hiển thị
      for (const chunk of chunkManager.activeChunks) {
        for (const t of chunk.trees) {
          if (t.x + 64 >= minX && t.x <= maxX && t.y + 118 >= minY && t.y <= maxY) {
            renderList.push({
              ySort: t.y + 112,
              draw: () => ctx.drawImage(t.img, t.x, t.y)
            });
          }
        }
      }

      // Gom bụi cây Berry Dại từ các chunk đang hiển thị
      const showBerries = !chkBerries || chkBerries.checked;
      if (showBerries) {
        const now = Date.now();
        const cycleMs = berryCycleSeconds * 1000;
        const animTime = performance.now();

        for (const chunk of chunkManager.activeChunks) {
          if (!chunk.berryBushes) continue;
          for (const bush of chunk.berryBushes) {
            if (bush.x + 32 >= minX && bush.x <= maxX && bush.y + 64 >= minY && bush.y <= maxY) {
              const elapsedMs = ((now - bush.plantedAt) % cycleMs + cycleMs) % cycleMs;
              const progress = elapsedMs / cycleMs;
              const stage = (berryStageOverride !== null) ? berryStageOverride : Math.min(3, Math.floor(progress * 4));
              const swayCol = Math.floor((animTime / 220 + bush.phase) % 4);
              const img = loadedImages[`berry_${bush.type.id}`];

              renderList.push({
                ySort: bush.gy * 32 + 16,
                draw: () => {
                  // Bóng đổ gốc cây
                  ctx.save();
                  ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
                  ctx.beginPath();
                  ctx.ellipse(bush.x + 16, bush.y + 60, 11, 5, 0, 0, Math.PI * 2);
                  ctx.fill();
                  ctx.restore();

                  if (img) {
                    ctx.drawImage(
                      img,
                      swayCol * 32, stage * 64, 32, 64,
                      bush.x, bush.y, 32, 64
                    );
                  }

                  // Quả chín mọng (Stage 3): Thêm ánh sáng lung linh
                  if (stage === 3) {
                    ctx.save();
                    ctx.fillStyle = bush.type.color;
                    ctx.shadowColor = bush.type.color;
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(bush.x + 16, bush.y + 10, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                  }
                }
              });
            }
          }
        }
      }

    // Hàm vẽ bong bóng biểu cảm phong cách Pokémon (Alert, Curious, Sweat, Dots)
    function drawWildEmote(ctx, cx, cy, emote) {
      ctx.save();
      const progress = 1 - (emote.timer / emote.maxTime);
      const bounce = Math.sin(Math.min(progress * 3, 1) * Math.PI) * 5;
      const by = cy - 14 - bounce;

      // Viền và nền bong bóng tròn
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#222222';
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.arc(cx, by, 7.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Mũi chỉ xuống đầu Pokémon
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(cx - 2, by + 6.5);
      ctx.lineTo(cx, by + 10.5);
      ctx.lineTo(cx + 2, by + 6.5);
      ctx.fill();
      ctx.stroke();

      // Phủ lại tâm bong bóng
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx, by, 6.5, 0, Math.PI * 2);
      ctx.fill();

      // Biểu tượng cảm xúc
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (emote.type === '!') {
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#e74c3c';
        ctx.fillText('!', cx, by);
      } else if (emote.type === '?') {
        ctx.font = 'bold 10px sans-serif';
        ctx.fillStyle = '#2980b9';
        ctx.fillText('?', cx, by);
      } else if (emote.type === 'sweat') {
        ctx.font = '10px sans-serif';
        ctx.fillStyle = '#3498db';
        ctx.fillText('💧', cx, by);
      } else if (emote.type === 'dots') {
        ctx.font = 'bold 9px sans-serif';
        ctx.fillStyle = '#7f8c8d';
        ctx.fillText('…', cx, by - 1);
      }
      ctx.restore();
    }

    // Wild Pokémon từ các chunk đang hiển thị
    for (const chunk of chunkManager.activeChunks) {
      if (!chunk.wildPokemon) continue;
      for (const wp of chunk.wildPokemon) {
        if (wp.x + 64 >= minX && wp.x <= maxX && wp.y + 64 >= minY && wp.y <= maxY) {
          const wpRef = wp; // closure capture
          // Bóng đổ
          renderList.push({
            ySort: wpRef.y + 56,
            draw: () => {
              ctx.save();
              ctx.fillStyle = 'rgba(0, 0, 0, 0.30)';
              ctx.beginPath();
              ctx.ellipse(wpRef.x + 32, wpRef.y + 58, 10, 5, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });
          // Sprite + Emote
          renderList.push({
            ySort: wpRef.y + 58,
            draw: () => {
              const img = loadedImages[wpRef.type.key];
              if (img) {
                const drawY = wpRef.y + (wpRef.bobY || 0);
                ctx.drawImage(
                  img,
                  wpRef.frame * 64, wpRef.dir * 64, 64, 64,
                  wpRef.x, drawY, 64, 64
                );

                // Vẽ bong bóng cảm xúc nếu có
                if (wpRef.emote && wpRef.emote.timer > 0) {
                  drawWildEmote(ctx, wpRef.x + 32, drawY + 14, wpRef.emote);
                }
              }
            }
          });
        }
      }
    }

      // Pikachu
      renderList.push({
        ySort: pika.y + 58,
        draw: () => {
          // Sprite sheet PIKACHU.png và trchar000.png có thứ tự 4 hàng đồng bộ:
          // Row 0: DOWN, Row 1: LEFT, Row 2: RIGHT, Row 3: UP
          ctx.drawImage(
            loadedImages['char_pika_sheet'],
            pika.frame * 64, pika.dir * 64, 64, 64,
            pika.x, pika.y, 64, 64
          );
        }
      });

      // Red
      renderList.push({
        ySort: player.y + 60,
        draw: () => {
          // Red sprite sheet: Row 0=DOWN, Row 1=LEFT, Row 2=RIGHT, Row 3=UP
          ctx.drawImage(
            loadedImages['char_red_sheet'],
            player.frame * 64, player.dir * 64, 64, 64,
            player.x, player.y, 64, 64
          );
        }
      });

      // Hiệu ứng ngập chân trong bụi cỏ GBA (Tall Grass Foot Wading / Foreground Overlap)
      if (showTallGrass && imgTG) {
        for (const chunk of chunkManager.activeChunks) {
          if (!chunk.tallGrass) continue;
          for (const tg of chunk.tallGrass) {
            const isRedHere = (player.gx === tg.gx && player.gy === tg.gy) ||
                              (player.isMoving && player.targetGX === tg.gx && player.targetGY === tg.gy);
            const isPikaHere = (pika.gx === tg.gx && pika.gy === tg.gy) ||
                               (pika.isMoving && pika.targetGX === tg.gx && pika.targetGY === tg.gy);

            // Kiểm tra xem có wild pokemon nào đứng trên ô cỏ cao này không
            let isWildHere = false;
            for (const wChunk of chunkManager.activeChunks) {
              if (!wChunk.wildPokemon) continue;
              for (const wp of wChunk.wildPokemon) {
                if ((wp.gx === tg.gx && wp.gy === tg.gy) ||
                    (wp.isMoving && wp.targetGX === tg.gx && wp.targetGY === tg.gy)) {
                  isWildHere = true;
                  break;
                }
              }
              if (isWildHere) break;
            }

            if (isRedHere || isPikaHere || isWildHere) {
              const tgY = tg.gy * 32 + 30; // Lớp ngọn cỏ phía trước che cẳng chân và giày
              renderList.push({
                ySort: tgY,
                draw: () => {
                  const animTime = performance.now();
                  const isMovingAny = (isRedHere && player.isMoving) || (isPikaHere && pika.isMoving) || isWildHere;
                  const fIdx = isMovingAny ? (Math.floor((animTime / 120) % 4) + 1) : 0;
                  ctx.drawImage(
                    imgTG,
                    fIdx * 32, 0, 32, 32,
                    tg.x, tg.y, 32, 32
                  );
                }
              });
            }
          }
        }
      }

      renderList.sort((a, b) => a.ySort - b.ySort);
      renderList.forEach(item => item.draw());

      // 7. Hitbox va chạm (nếu bật)
      if (chkHitbox && chkHitbox.checked) {
        ctx.save();
        ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.strokeStyle = '#ef4444';
        for (const chunk of chunkManager.activeChunks) {
          for (const c of chunk.colliders) {
            ctx.fillRect(c.x, c.y, c.w, c.h);
            ctx.strokeRect(c.x, c.y, c.w, c.h);
          }
        }

        ctx.fillStyle = 'rgba(59, 130, 246, 0.5)';
        ctx.strokeStyle = '#3b82f6';
        ctx.fillRect(player.x + 22, player.y + 48, 20, 14);
        ctx.strokeRect(player.x + 22, player.y + 48, 20, 14);
        ctx.restore();
      }

      ctx.restore();
    }

    // --- MOUSE INSPECTOR WITH WORLD COORDINATES ---
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const screenX = (e.clientX - rect.left) / camera.zoom;
      const screenY = (e.clientY - rect.top) / camera.zoom;
      const viewW = canvas.width / camera.zoom;
      const viewH = canvas.height / camera.zoom;

      const worldX = screenX + (camera.x - viewW / 2);
      const worldY = screenY + (camera.y - viewH / 2);

      const gx = Math.floor(worldX / 32);
      const gy = Math.floor(worldY / 32);

      const data = chunkManager.getTileData(gx, gy);
      const info = TILE_INFO[data.tileId] || { name: 'unknown', desc: 'Không xác định' };

      document.getElementById('insCoords').innerText = `[${gx}, ${gy}]`;
      document.getElementById('insChunk').innerText = `[${data.cx}, ${data.cy}] (cục bộ [${data.lx}, ${data.ly}])`;

      const insTerrain = document.getElementById('insTerrain');
      const insTreeRule = document.getElementById('insTreeRule');

      if (data.tallGrass) {
        insTerrain.innerText = `Bụi cỏ cao hoang dã GBA (Bãi #${data.tallGrass.patchId + 1})`;
        insTerrain.className = 'inspector-val grass';
        insTreeRule.innerText = 'Cỏ cao (Tỷ lệ gặp Pokémon hoang dã)';
        insTreeRule.className = 'inspector-val success';
      } else if (data.terrain === TERRAIN.GRASS) {
        insTerrain.innerText = 'Đồng cỏ (ID: 1)';
        insTerrain.className = 'inspector-val grass';
        insTreeRule.innerText = 'Cho phép mọc cây (Màu mỡ)';
        insTreeRule.className = 'inspector-val success';
      } else if (data.terrain === TERRAIN.ROAD) {
        insTerrain.innerText = 'Đường mòn đất (ID: 2)';
        insTerrain.className = 'inspector-val road';
        insTreeRule.innerText = 'Bị cấm (Mặt đường nén)';
        insTreeRule.className = 'inspector-val danger';
      } else if (data.terrain === TERRAIN.BEACH_SAND) {
        insTerrain.innerText = 'Bãi cát biển (ID: 3)';
        insTerrain.className = 'inspector-val beach';
        insTreeRule.innerText = 'Bị cấm (Cát biển không sinh cây)';
        insTreeRule.className = 'inspector-val danger';
      }

      let plantText = '';
      if (data.plant === 'flower_red') plantText = ' + 🌺 Hoa đỏ';
      else if (data.plant === 'flower_blue') plantText = ' + 🌸 Hoa xanh';
      else if (data.plant === 'flower_purple') plantText = ' + 🪻 Hoa tím';
      else if (data.plant === 'flower_white') plantText = ' + 🌼 Hoa trắng';
      else if (data.plant === 'plant_sprout') plantText = ' + 🌱 Mầm cỏ';

      if (data.tallGrass) {
        document.getElementById('insTileId').innerText = `#610 Cỏ cao GBA [Bãi ${data.tallGrass.patchId + 1}]${plantText}`;
      } else {
        document.getElementById('insTileId').innerText = `#${data.tileId} ${info.name}${plantText}`;
      }

      // Kiểm tra xem chuột có trỏ trúng bụi Berry nào không
      let hoveredBush = null;
      for (const chunk of chunkManager.activeChunks) {
        if (!chunk.berryBushes) continue;
        for (const b of chunk.berryBushes) {
          if ((b.gx === gx && b.gy === gy) || (b.gx === gx && b.gy - 1 === gy)) {
            hoveredBush = b;
            break;
          }
        }
        if (hoveredBush) break;
      }

      const rowBerryInfo = document.getElementById('rowBerryInfo');
      const insBerryVal = document.getElementById('insBerryVal');
      if (hoveredBush && rowBerryInfo && insBerryVal) {
        const now = Date.now();
        const cycleMs = berryCycleSeconds * 1000;
        const elapsedMs = ((now - hoveredBush.plantedAt) % cycleMs + cycleMs) % cycleMs;
        const progress = elapsedMs / cycleMs;
        const stage = (berryStageOverride !== null) ? berryStageOverride : Math.min(3, Math.floor(progress * 4));
        const stageInfo = BERRY_STAGES[stage];
        const elapsedSec = Math.floor(elapsedMs / 1000);

        rowBerryInfo.style.display = 'flex';
        insBerryVal.innerText = `${hoveredBush.type.viName} [${stageInfo.icon} ${stageInfo.name}] (${elapsedSec}s/${berryCycleSeconds}s)`;
        insBerryVal.style.color = hoveredBush.type.color;
      } else if (rowBerryInfo) {
        rowBerryInfo.style.display = 'none';
      }
    });

    // --- TƯƠNG TÁC THU HOẠCH BERRY (Phím Space/Enter/E hoặc Click chuột) ---
    function interactWithBerryBush(bush) {
      const now = Date.now();
      const cycleMs = berryCycleSeconds * 1000;
      const elapsedMs = ((now - bush.plantedAt) % cycleMs + cycleMs) % cycleMs;
      const progress = elapsedMs / cycleMs;
      const stage = (berryStageOverride !== null) ? berryStageOverride : Math.min(3, Math.floor(progress * 4));

      if (stage === 3) {
        // Thu hoạch trái chín
        const count = 2 + Math.floor(Math.random() * 3); // 2 - 4 quả
        showBerryToast(`🫐 Tuyệt vời! Bạn đã hái được ${count} quả ${bush.type.viName} (${bush.type.name})! [${bush.type.desc}]`, bush.type.color);
        // Tái sinh thành mầm non cho chu kỳ mới
        bush.plantedAt = now;
      } else {
        const stageInfo = BERRY_STAGES[stage];
        const stageDurationMs = cycleMs / 4;
        const currentStageElapsedMs = elapsedMs % stageDurationMs;
        const remainingStageSec = Math.ceil((stageDurationMs - currentStageElapsedMs) / 1000);
        showBerryToast(`${stageInfo.icon} Bụi ${bush.type.viName} đang ở giai đoạn: ${stageInfo.name}. Còn ${remainingStageSec}s nữa sẽ lớn tiếp!`, '#38bdf8');
      }
    }

    function triggerBerryInteraction() {
      // Tìm bụi cây trước mặt Red hoặc ngay sát chân
      let targetGX = player.gx;
      let targetGY = player.gy;
      if (player.dir === 0) targetGY += 1;      // Đang nhìn Xuống
      else if (player.dir === 1) targetGX -= 1; // Đang nhìn Trái
      else if (player.dir === 2) targetGX += 1; // Đang nhìn Phải
      else if (player.dir === 3) targetGY -= 1; // Đang nhìn Lên

      let foundBush = null;
      for (const chunk of chunkManager.activeChunks) {
        if (!chunk.berryBushes) continue;
        for (const b of chunk.berryBushes) {
          if ((b.gx === targetGX && b.gy === targetGY) ||
              (b.gx === targetGX && b.gy - 1 === targetGY) ||
              (Math.abs(b.gx - player.gx) <= 1 && Math.abs(b.gy - player.gy) <= 1)) {
            foundBush = b;
            break;
          }
        }
        if (foundBush) break;
      }

      if (foundBush) {
        interactWithBerryBush(foundBush);
      }
    }

    canvas.addEventListener('click', (e) => {
      canvas.focus();
      const rect = canvas.getBoundingClientRect();
      const screenX = (e.clientX - rect.left) / camera.zoom;
      const screenY = (e.clientY - rect.top) / camera.zoom;
      const viewW = canvas.width / camera.zoom;
      const viewH = canvas.height / camera.zoom;
      const worldX = screenX + (camera.x - viewW / 2);
      const worldY = screenY + (camera.y - viewH / 2);
      const clickGX = Math.floor(worldX / 32);
      const clickGY = Math.floor(worldY / 32);

      for (const chunk of chunkManager.activeChunks) {
        if (!chunk.berryBushes) continue;
        for (const b of chunk.berryBushes) {
          if ((b.gx === clickGX && b.gy === clickGY) || (b.gx === clickGX && b.gy - 1 === clickGY)) {
            interactWithBerryBush(b);
            return;
          }
        }
      }
    });

    let lastTime = performance.now();
    let frameCount = 0;
    let fpsTimer = 0;

    function gameLoop(time) {
      const dt = time - lastTime;
      lastTime = time;
      frameCount++;
      fpsTimer += dt;
      if (fpsTimer >= 1000) {
        document.getElementById('lblFps').innerText = frameCount;
        frameCount = 0;
        fpsTimer = 0;
      }

      // Chuẩn hóa dtScale theo mốc 60 FPS (16.67ms/frame). Kẹp [0.1, 2.5] chống spike/giật lag
      const dtScale = Math.min(Math.max((dt || 16.667) / (1000 / 60), 0.1), 2.5);

      update(dtScale);
      render();
      requestAnimationFrame(gameLoop);
    }

    function applyPreset(seed, biome) {
      document.getElementById('inputSeed').value = seed;
      document.getElementById('selectBiome').value = biome;
      resetWorld();
    }

    document.getElementById('btnRegenerate').addEventListener('click', resetWorld);
    document.getElementById('btnResetPlayer').addEventListener('click', resetWorld);
    document.getElementById('btnRandomSeed').addEventListener('click', () => {
      document.getElementById('inputSeed').value = Math.floor(Math.random() * 89999 + 10000);
      resetWorld();
    });

    document.getElementById('btnToggleOverlay').addEventListener('click', () => {
      const overlay = document.getElementById('testOverlay');
      overlay.classList.toggle('collapsed');
      const isCollapsed = overlay.classList.contains('collapsed');
      document.getElementById('btnToggleOverlay').innerText = isCollapsed ? '⚙️' : '✕';
    });

    // Kéo thả bảng overlay kiểm thử tự do trên màn hình
    const overlayEl = document.getElementById('testOverlay');
    const overlayHeader = overlayEl.querySelector('.overlay-header');
    let isDraggingOverlay = false;
    let dragStartX = 0, dragStartY = 0, initialLeft = 0, initialTop = 0;

    overlayHeader.addEventListener('mousedown', (e) => {
      if (e.target.closest('#btnToggleOverlay')) return;
      isDraggingOverlay = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      const rect = overlayEl.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDraggingOverlay) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      const newX = Math.max(8, Math.min(window.innerWidth - overlayEl.offsetWidth - 8, initialLeft + dx));
      const newY = Math.max(8, Math.min(window.innerHeight - overlayEl.offsetHeight - 8, initialTop + dy));
      overlayEl.style.left = `${newX}px`;
      overlayEl.style.top = `${newY}px`;
    });

    window.addEventListener('mouseup', () => {
      isDraggingOverlay = false;
    });

    ['selectBiome', 'chkRoad', 'chkBeach', 'chkHills', 'chkTrees', 'chkTallGrass', 'chkPlants', 'chkBerries', 'chkCollision', 'chkChunkGrid', 'chkGrid', 'chkHitbox', 'chkHeatmap'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', resetWorld);
    });

    // Lắng nghe thay đổi chu kỳ phát triển Berry
    if (selectBerryCycle) {
      selectBerryCycle.addEventListener('change', (e) => {
        berryCycleSeconds = parseInt(e.target.value) || 60;
        showBerryToast(`⏱️ Đã đặt chu kỳ Berry: ${berryCycleSeconds} giây (${(berryCycleSeconds / 60).toFixed(1)} phút / vòng đời)`, '#c084fc');
      });
    }

    // Các nút ép xem nhanh giai đoạn phát triển Berry
    document.querySelectorAll('.btn-berry-stage').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-berry-stage').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const st = btn.dataset.stage;
        if (st === 'auto') {
          berryStageOverride = null;
          showBerryToast('🔄 Chế độ Berry: Tự động phát triển theo thời gian thực', '#a855f7');
        } else {
          berryStageOverride = parseInt(st);
          const stInfo = BERRY_STAGES[berryStageOverride];
          showBerryToast(`⚡ Ép xem giai đoạn: ${stInfo.icon} ${stInfo.name} (${stInfo.desc})`, '#38bdf8');
        }
      });
    });

    preloadAssets(() => {
      console.log('Pokémon Chunk Engine & Camera Initialized.');
      resizeCanvas();
      resetWorld();
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
